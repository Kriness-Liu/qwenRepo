[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qwenrepo"
version = "0.2.0"
description = "Inspectable Qwen inference, KV cache and performance experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.37",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
